name: Pipeline CI/CD com OTLP Genérico (Elastic APM)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependências
        run: npm install

      - name: Executar Testes
        run: npm test
        continue-on-error: true
      - name: Enviar Traces OTLP Customizados para Elastic APM
        if: always()
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.ELASTIC_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.ELASTIC_OTLP_HEADERS }}
        run: |
          python -m pip install opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http
          python -c "
          import os
          from opentelemetry import trace
          from opentelemetry.sdk.trace import TracerProvider
          from opentelemetry.sdk.trace.export import BatchSpanProcessor
          from opentelemetry.exporter.otlp.proto.http.trace_exporter import OTLPSpanExporter

          provider = TracerProvider()
          processor = BatchSpanProcessor(OTLPSpanExporter())
          provider.add_span_processor(processor)
          trace.set_tracer_provider(provider)

          tracer = trace.get_tracer('github-actions-tracer')
          with tracer.start_as_current_span('workflow-run-${{ github.run_id }}') as span:
              span.set_attribute('github.repository', '${{ github.repository }}')
              span.set_attribute('github.workflow', '${{ github.workflow }}')
          print('Trace enviado com sucesso para o Elastic APM!')
          "
