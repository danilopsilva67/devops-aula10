name: Pipeline de CI - Testes Automatizados

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ] # Dispara na criação de tags de versão (ex: v1.0.0)
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    name: Execução de Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependências
        run: npm install

      - name: Executar Suíte de Testes
        run: npm test
