name: Pipeline CI/CD com OpenTelemetry Tracing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependências
        run: npm install

      - name: Executar Testes
        run: npm test
        continue-on-error: true

      - name: OpenTelemetry Tracing Setup
        uses: dash0hq/otel-cicd-action@v4
        if: always()
        with:
          otlpEndpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          otelServiceName: "teste_danilo"
          githubToken: ${{ secrets.GITHUB_TOKEN }}
