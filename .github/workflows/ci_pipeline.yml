name: Pipeline CI/CD com Elastic APM (Python OTLP Customizado)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependências
        run: npm install

      - name: Executar Testes
        run: npm test
        # O 'continue-on-error: true' garante que mesmo se os testes falharem, 
        # o workflow continuará para enviar o trace do resultado ao APM.
        continue-on-error: true

      - name: Enviar Traces para o Elastic APM
        if: always()
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.ELASTIC_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.ELASTIC_OTLP_HEADERS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_JOB: ${{ github.job }}
        run: |
          python -m pip install opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http requests
          python -c '
          import os
          import sys
          from opentelemetry import trace
          from opentelemetry.sdk.trace import TracerProvider
          from opentelemetry.sdk.trace.export import SimpleSpanProcessor
          from opentelemetry.exporter.otlp.proto.http.trace_exporter import OTLPSpanExporter

          raw_endpoint = os.getenv("OTEL_EXPORTER_OTLP_ENDPOINT", "")
          if not raw_endpoint.endswith("/v1/traces"):
              endpoint = raw_endpoint.rstrip("/") + "/v1/traces"
          else:
              endpoint = raw_endpoint

          raw_headers = os.getenv("OTEL_EXPORTER_OTLP_HEADERS", "")
          headers = {}
          if raw_headers:
              for part in raw_headers.split(","):
                  if "=" in part:
                      k, v = part.split("=", 1)
                      headers[k.strip()] = v.strip()

          wf = os.getenv("GITHUB_WORKFLOW", "Pipeline")
          jb = os.getenv("GITHUB_JOB", "job")
          repo = os.getenv("GITHUB_REPOSITORY", "repo")
          run_id = os.getenv("GITHUB_RUN_ID", "0")

          print(f"Enviando traces para o endpoint: {endpoint}")

          try:
              provider = TracerProvider()
              exporter = OTLPSpanExporter(endpoint=endpoint, headers=headers, timeout=20)
              processor = SimpleSpanProcessor(exporter)
              provider.add_span_processor(processor)
              trace.set_tracer_provider(provider)

              tracer = trace.get_tracer("github-actions-telemetry")

              with tracer.start_as_current_span(f"GitHub Actions - {wf} / {jb}") as span:
                  span.set_attribute("github.repository", repo)
                  span.set_attribute("github.run.id", run_id)

              provider.force_flush()
              provider.shutdown()
              print("Processo de exportação concluído com sucesso!")
          except Exception as e:
              print(f"Erro crítico ao exportar spans: {e}", file=sys.stderr)
              sys.exit(1)
          '
