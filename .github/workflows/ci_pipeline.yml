name: Pipeline CI/CD com OpenTelemetry Tracing

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Testes
        run: npm test
        continue-on-error: true # Mantém o pipeline rodando para enviar o trace mesmo se os testes falharem

      # Configuração do OpenTelemetry com Identificadores do Grupo
      - name: OpenTelemetry Tracing Setup
        uses: dash0hq/otel-cicd-action@v4
        if: always() # Garante que o trace será enviado mesmo se alguma etapa anterior falhar
        with:
          otlpEndpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          # otlpHeaders: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }} # Descomente se a Dash0 exigir token/headers de autenticação
          otelServiceName: "teste_danilo"
          githubToken: ${{ secrets.GITHUB_TOKEN }}
