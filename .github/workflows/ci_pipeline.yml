name: Pipeline CI/CD com OpenTelemetry Tracing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Permissões completas essenciais para a API do GitHub e artefatos na v1
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependências
        # Trocado de 'npm ci' para 'npm install' para evitar erro de package-lock.json ausente
        run: npm install

      - name: Executar Testes
        run: npm test
        continue-on-error: true

      - name: Criar artefato de apoio (exigido pela v1)
        if: always()
        run: |
          echo "Gerando artefato para o OTel v1" > otel-artifact.txt

      - name: Upload do artefato de apoio (Usando v3 para compatibilidade com a v1)
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: relatorio-ci
          path: otel-artifact.txt

      - name: OpenTelemetry Tracing Setup (v1)
        uses: corentinmusard/otel-cicd-action@v1
        if: always()
        with:
          otlpEndpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          otelServiceName: "teste_danilo"
          githubToken: ${{ secrets.GITHUB_TOKEN }}
