name: Pipeline CI/CD com OpenTelemetry (Elastic APM)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Garante permissões de leitura essenciais para a API do GitHub coletar o contexto do workflow
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependências
        run: npm install

      - name: Executar Testes
        run: npm test
        # O 'continue-on-error: true' garante que mesmo se os testes falharem, 
        # o pipeline continuará para a etapa de exportação da telemetria.
        continue-on-error: true

      - name: OpenTelemetry Tracing Setup (Elastic APM)
        uses: dash0hq/otel-cicd-action@v4
        # O 'if: always()' é fundamental: assegura que o trace do workflow inteiro 
        # será enviado independentemente do sucesso ou falha das etapas anteriores.
        if: always()
        with:
          # URL do seu Elastic APM Server (ex: Cloud ou instância self-hosted)
          otlpEndpoint: ${{ secrets.ELASTIC_OTLP_ENDPOINT }}
          
          # Cabeçalho de autorização contendo a API Key ou Token do Elastic APM novo
          otlpHeaders: ${{ secrets.ELASTIC_OTLP_HEADERS }}
          
          # Nome do serviço que aparecerá no Elastic APM (pode ajustar para o do seu grupo)
          otelServiceName: "teste_danilo"
          
          githubToken: ${{ secrets.GITHUB_TOKEN }}
