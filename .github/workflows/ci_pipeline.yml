name: CI Process

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependências do projeto
      run: npm install

    # ETAPA 1: ANÁLISE ESTÁTICA DE CÓDIGO (LINTER)
    - name: Executar análise estática de código (Linter)
      run: npm run lint

    # ETAPA 2: TESTES AUTOMATIZADOS
    - name: Executar testes automatizados
      run: npm test
