name: Pipeline de CI - Testes Automatizados

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ] # Dispara na criação de tags de versão (ex: v1.0.0)
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    name: Execução de Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
          
      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependências
        run: npm install

      - name: Executar Suíte de Testes
        run: npm test
              # Configuração do OpenTelemetry com Identificadores do Grupo
      - name: OpenTelemetry Tracing Setup
        uses: dash0hq/otel-cicd-action@v4
        with:
          otlpEndpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          
          # 1. Identificador único do projeto/grupo no Elastic APM
          otelServiceName: "teste_danilo"
          githubToken: ${{ secrets.GITHUB_TOKEN }}
