name: Pipeline CI/CD com Elastic APM (Python OTLP Customizado)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependências
        run: npm install

      - name: Executar Testes
        run: npm test
        # O 'continue-on-error: true' garante que mesmo se os testes falharem, 
        # o workflow continuará para enviar o trace do resultado ao APM.
        continue-on-error: true

      - name: Enviar Traces para o Elastic APM
        if: always()
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.ELASTIC_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.ELASTIC_OTLP_HEADERS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_JOB: ${{ github.job }}
        run: |
          python -m pip install opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http
          python -c '
          import os
          from opentelemetry import trace
          from opentelemetry.sdk.trace import TracerProvider
          from opentelemetry.sdk.trace.export import SimpleSpanProcessor
          from opentelemetry.exporter.otlp.proto.http.trace_exporter import OTLPSpanExporter

          provider = TracerProvider()
          exporter = OTLPSpanExporter()
          processor = SimpleSpanProcessor(exporter)
          provider.add_span_processor(processor)
          trace.set_tracer_provider(provider)

          tracer = trace.get_tracer("github-actions-telemetry")

          repo = os.getenv("GITHUB_REPOSITORY", "desconhecido")
          workflow = os.getenv("GITHUB_WORKFLOW", "desconhecido")
          run_id = os.getenv("GITHUB_RUN_ID", "desconhecido")
          job = os.getenv("GITHUB_JOB", "desconhecido")

          with tracer.start_as_current_span(f"GitHub Actions - {workflow} / {job}") as span:
              span.set_attribute("github.repository", repo)
              span.set_attribute("github.run.id", run_id)
              span.set_attribute("github.job.name", job)

          provider.force_flush()
          provider.shutdown()
          print("Trace enviado e confirmado com sucesso para o Elastic APM!")
          '
