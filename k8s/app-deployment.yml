apiVersion: apps/v1
kind: Deployment
metadata:
  name: minha-api-node-deployment
spec:
  replicas: 3 # REPLICAÇÃO: 3 instâncias em execução
  selector:
    matchLabels:
      app: minha-api-node
  template:
    metadata:
      labels:
        app: minha-api-node
    spec:
      containers:
      - name: minha-api-node
        image: minha-api-node:1.0 # Certifique-se de compilar/carregar a imagem no cluster
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_HOST
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_USER
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_NAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: minha-api-node-service
spec:
  type: NodePort
  selector:
    app: minha-api-node
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080 # Exposição externa
